name: KubePilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend Code Linting & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Run Flake8 Code Syntax & Style Lint
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Automated Unit Tests
        env:
          PYTHONPATH: ./backend
        run: |
          cd backend
          python -m pytest -v

  docker-build:
    name: Build & Validate Docker Containers
    runs-on: ubuntu-latest
    needs: backend-lint-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        run: |
          docker build -t kubepilot-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t kubepilot-frontend:ci ./frontend
